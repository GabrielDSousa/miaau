# Miaau — Worker da Cloudflare + D1.
#
# O Worker serve o site e recebe os lotes do coletor:
#   POST /ingest        ← lote classificado (Bearer INGEST_TOKEN)
#   GET  /queue?limit=N → itens que precisam ser abertos (Bearer INGEST_TOKEN)
#
# O coletor roda no GitHub Actions: o Nyaa devolve 429 para 100% do egress de
# Worker (medido na Fase 0) e 200 para o do Actions.
#
# Depois do login (`npx wrangler login`):
#   npx wrangler d1 execute miaau --remote --file=db/schema.sql
#   npx wrangler secret put INGEST_TOKEN            # mesmo valor do secret do GitHub
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN   # fine-grained, Actions: write
#   npx wrangler deploy
#
# O INGEST_TOKEN nunca mora neste arquivo: é secret do Worker, secret do
# repositório no GitHub e `.env` local (ignorado pelo git).

name = "miaau-spike"
main = "src/index.ts"
compatibility_date = "2026-11-01"

workers_dev = true

[observability]
enabled = true

[vars]
NYAA_BASE = "https://nyaa.si"
MIAU_CONTACT = "gabrielramos.email@gmail.com"
# Repositório que roda a coleta. O token de dispatch é secret, não var.
GITHUB_REPO = "GabrielDSousa/miaau"
GITHUB_WORKFLOW = "collect.yml"
GITHUB_REF = "main"
# Detalhes abertos por ciclo disparado pelo cron. O backfill encheu a fila de
# verificação; 25 drena ~3.600/dia sem passar de ~30 s por execução.
GITHUB_LIMIT = "25"
# Cron do ciclo incremental. O outro cron configurado abaixo dispara o backfill.
GITHUB_CRON = "*/10 * * * *"

# O agendador do GitHub Actions não disparou neste repositório, então quem
# acorda a coleta é o cron da Cloudflare: a cada 10 min o Worker faz uma única
# chamada à API do GitHub (workflow_dispatch). O Worker continua sem tocar no
# Nyaa — quem coleta é o runner, que recebe 200 em vez de 429.
#
# O segundo cron é o backfill diário de cobertura (termos + tags de grupo, com
# varredura nas duas direções dos termos que batem no teto de 1000 do Nyaa).
[triggers]
crons = ["*/10 * * * *", "17 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "miaau"
database_id = "9d11ecec-fa67-4377-9149-9e5bc53fbd14"
