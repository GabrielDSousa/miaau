# Miaau — Worker da Cloudflare + D1.
#
# O Worker serve o site e recebe os lotes do coletor:
#   POST /ingest        ← lote classificado (Bearer INGEST_TOKEN)
#   GET  /queue?limit=N → itens que precisam ser abertos (Bearer INGEST_TOKEN)
#
# O coletor roda no GitHub Actions: o Nyaa devolve 429 para 100% do egress de
# Worker (medido na Fase 0) e 200 para o do Actions.
#
# Depois do login (`npx wrangler login`):
#   npx wrangler d1 execute miaau --remote --file=db/schema.sql
#   npx wrangler secret put INGEST_TOKEN    # mesmo valor do secret do GitHub
#   npx wrangler deploy
#
# O INGEST_TOKEN nunca mora neste arquivo: é secret do Worker, secret do
# repositório no GitHub e `.env` local (ignorado pelo git).

name = "miaau-spike"
main = "src/index.ts"
compatibility_date = "2026-11-01"

workers_dev = true

[observability]
enabled = true

[vars]
NYAA_BASE = "https://nyaa.si"
MIAU_CONTACT = "gabrielramos.email@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "miaau"
database_id = "9d11ecec-fa67-4377-9149-9e5bc53fbd14"
